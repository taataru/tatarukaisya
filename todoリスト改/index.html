<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="日々のTODOをRPGのクエストとして進める、保存つきのブラウザ完結タスク管理アプリ。">
  <meta property="og:title" content="Adventure Todo Quest">
  <meta property="og:description" content="TODOを倒して経験値とゴールドを集める、RPG風タスク管理アプリ。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <title>Adventure Todo Quest</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171821;
      --panel: #222635;
      --panel-soft: #292f42;
      --line: #3a4158;
      --text: #f5f7fb;
      --muted: #aab3c8;
      --gold: #f5b942;
      --blue: #62a8ff;
      --red: #ff6b73;
      --green: #68d391;
      --purple: #b794f4;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(98, 168, 255, 0.18), transparent 32rem),
        linear-gradient(135deg, #171821 0%, #202331 52%, #161a24 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body.danger-state {
      background:
        radial-gradient(circle at top left, rgba(255, 107, 115, 0.34), transparent 30rem),
        linear-gradient(135deg, #3b1118 0%, #24131b 48%, #170b10 100%);
    }

    body.danger-state .panel {
      border-color: rgba(255, 107, 115, 0.44);
      box-shadow: 0 18px 46px rgba(255, 55, 72, 0.2);
    }

    body.danger-state .brand h1,
    body.danger-state #hpText {
      color: #ffb3b8;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 3.3rem);
      line-height: 1.05;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 56rem;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.45fr) minmax(260px, 0.8fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: rgba(34, 38, 53, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .section {
      padding: 18px;
    }

    .section + .section {
      border-top: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
      font-size: 0.95rem;
      text-transform: uppercase;
      color: #dce4f8;
    }

    .player {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: center;
    }

    .avatar {
      width: 72px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #353b52, #1f2434);
      border: 3px solid var(--gold);
      color: var(--gold);
      font-weight: 900;
      font-size: 1.25rem;
    }

    .player h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .player p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .bar-row {
      margin-top: 14px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 6px;
    }

    .bar {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: #141824;
      border: 1px solid #30384f;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 240ms ease;
    }

    .fill.exp { background: var(--blue); }
    .fill.hp { background: var(--red); }
    .fill.mp { background: var(--purple); }
    .fill.goal { background: var(--gold); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      min-width: 0;
      padding: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.73rem;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 1.35rem;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.7fr 0.7fr 0.7fr;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
    }

    label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      color: var(--text);
      background: #171c29;
      border: 1px solid #414b65;
      border-radius: var(--radius);
      outline: 0;
      padding: 11px 12px;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(98, 168, 255, 0.14);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 13px;
      border-radius: var(--radius);
      color: var(--text);
      background: #3a425a;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: #46506d;
    }

    .btn.primary {
      background: #d99621;
      color: #171821;
      font-weight: 800;
    }

    .btn.primary:hover {
      background: var(--gold);
    }

    .btn.good {
      background: #257447;
    }

    .btn.good:hover {
      background: #2d8e56;
    }

    .btn.danger {
      background: #71313d;
    }

    .btn.danger:hover {
      background: #8c3b49;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .btn.ghost:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn.icon {
      width: 40px;
      padding: 0;
      flex: 0 0 40px;
    }

    .quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .tab {
      min-width: 0;
      padding: 10px 8px;
      border-radius: var(--radius);
      background: #1a2030;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .tab.active {
      color: #171821;
      background: var(--gold);
      border-color: var(--gold);
      font-weight: 800;
    }

    .task-list {
      display: grid;
      gap: 10px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      padding: 14px;
      background: rgba(41, 47, 66, 0.92);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: var(--radius);
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .task-card:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 185, 66, 0.78);
    }

    .task-card.easy { border-left-color: var(--green); }
    .task-card.normal { border-left-color: var(--gold); }
    .task-card.hard { border-left-color: var(--red); }

    .task-card h3 {
      margin: 4px 0 5px;
      font-size: 1.03rem;
      overflow-wrap: anywhere;
    }

    .task-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: #d8dfef;
      font-size: 0.73rem;
      margin-top: 9px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #161c2a;
      border: 1px solid #3b465f;
      color: #d8dfef;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #47516b;
      border-radius: var(--radius);
      background: rgba(23, 28, 41, 0.62);
    }

    .shop-list,
    .log-list {
      display: grid;
      gap: 10px;
    }

    .reward {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .reward strong {
      display: block;
      font-size: 0.9rem;
    }

    .reward span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .log-list {
      max-height: 260px;
      overflow: auto;
      padding-right: 4px;
    }

    .log-item {
      padding: 9px 10px;
      background: #181e2c;
      border-left: 3px solid var(--blue);
      border-radius: 6px;
      color: #d8dfef;
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .world-box {
      display: grid;
      gap: 10px;
    }

    .goal-input {
      min-height: 104px;
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100% - 36px));
      padding: 12px 14px;
      color: #171821;
      background: var(--gold);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-weight: 800;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
      }

      .top-actions {
        justify-content: flex-start;
      }

    }

    @media (max-width: 760px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .field:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 16px, 1180px);
        padding: 10px 0 22px;
      }

      .brand h1 {
        font-size: 2rem;
      }

      .brand p {
        font-size: 0.9rem;
      }

      .form-grid,
      .task-card,
      .reward {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 14px;
      }

      .topbar {
        gap: 10px;
        margin-bottom: 10px;
      }

      .top-actions,
      .top-actions .btn,
      .btn.primary {
        width: 100%;
      }

      .layout {
        gap: 10px;
      }

      input,
      select,
      textarea,
      .btn,
      .tab {
        min-height: 44px;
      }

      .player {
        grid-template-columns: 56px 1fr;
        gap: 10px;
      }

      .avatar {
        width: 56px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .task-actions {
        justify-content: stretch;
      }

      .task-actions .btn {
        flex: 1;
      }

      .tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .tab {
        padding-inline: 4px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Adventure Todo Quest</h1>
        <p>TODOをクエスト化して、達成すると経験値とゴールドが増えるブラウザ完結のタスク管理アプリです。</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost" type="button" id="exportButton" title="データを書き出す">JSON出力</button>
        <button class="btn ghost" type="button" id="resetButton" title="保存データを初期化">初期化</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel">
        <section class="section">
          <div class="player">
            <div class="avatar" aria-hidden="true">LV</div>
            <div>
              <h2 id="playerName">冒険者</h2>
              <p id="playerTitle">はじまりのクエスト管理者</p>
            </div>
          </div>

          <div class="bar-row">
            <div class="bar-label"><span>EXP</span><span id="expText">0/100</span></div>
            <div class="bar"><div class="fill exp" id="expBar"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-label"><span>HP</span><span id="hpText">100/100</span></div>
            <div class="bar"><div class="fill hp" id="hpBar"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-label"><span>MP</span><span id="mpText">80/100</span></div>
            <div class="bar"><div class="fill mp" id="mpBar"></div></div>
          </div>

          <div class="stat-grid">
            <div class="stat"><span>Level</span><strong id="levelText">1</strong></div>
            <div class="stat"><span>Gold</span><strong id="goldText">0</strong></div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Goal</h2>
          <div class="world-box">
            <label for="goalInput">目標</label>
            <textarea id="goalInput" class="goal-input" maxlength="260" placeholder="例: 今週中にポートフォリオの公開準備を終わらせる"></textarea>
            <label for="worldSelect">テンプレ世界観</label>
            <select id="worldSelect">
              <option value="fantasy">ファンタジー</option>
              <option value="sf">SF</option>
              <option value="spy">スパイ</option>
              <option value="life">日常整備</option>
            </select>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Recovery</h2>
          <button class="btn good" type="button" id="restButton">休憩して回復</button>
          <button class="btn ghost" type="button" id="restModeButton">休憩モード OFF</button>
        </section>
      </aside>

      <main class="panel">
        <section class="section">
          <h2 class="section-title">New Quest</h2>
          <form id="taskForm" autocomplete="off">
            <div class="form-grid">
              <div class="field">
                <label for="taskTitle">クエスト名</label>
                <input id="taskTitle" type="text" maxlength="80" placeholder="例: 企画書の初稿を書く" required>
              </div>
              <div class="field">
                <label for="difficultySelect">難易度</label>
                <select id="difficultySelect">
                  <option value="1">Easy</option>
                  <option value="3" selected>Normal</option>
                  <option value="5">Hard</option>
                </select>
              </div>
              <div class="field">
                <label for="goldInput">獲得Gold</label>
                <input id="goldInput" type="number" min="0" max="9999" step="1" value="54">
              </div>
              <div class="field">
                <label for="fatigueInput">疲労度</label>
                <input id="fatigueInput" type="number" min="0" max="999" step="1" value="18">
              </div>
            </div>
            <div class="field">
              <label for="taskMeaning">このクエストの意味</label>
              <textarea id="taskMeaning" maxlength="220" placeholder="例: 明日の自分が迷わない状態にする"></textarea>
            </div>
            <button class="btn primary" type="submit">クエスト追加</button>
          </form>
        </section>

        <section class="section">
          <h2 class="section-title">Templates</h2>
          <div class="quick-list" id="templateList"></div>
        </section>

        <section class="section">
          <div class="tabs" role="tablist" aria-label="クエスト表示">
            <button class="tab active" type="button" data-filter="active">進行中</button>
            <button class="tab" type="button" data-filter="completed">完了</button>
            <button class="tab" type="button" data-filter="failed">ログ</button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </main>

      <aside class="panel">
        <section class="section">
          <h2 class="section-title">Reward Shop</h2>
          <div class="shop-list" id="shopList"></div>
        </section>

        <section class="section">
          <h2 class="section-title">Adventure Log</h2>
          <div class="log-list" id="logList"></div>
        </section>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "adventure_todo_quest_v1";

    const worldPacks = {
      fantasy: {
        name: "ファンタジー",
        title: "王国のクエスト管理者",
        templates: [
          ["集中の試練", "25分だけ一つの作業に集中する", 3],
          ["書庫の整理", "メモや資料を一か所にまとめる", 1],
          ["魔導書の読解", "学習したことを3行で記録する", 3]
        ]
      },
      sf: {
        name: "SF",
        title: "ステーションの運用者",
        templates: [
          ["コア修復", "最重要タスクを一つだけ進める", 5],
          ["同期チェック", "受信箱と予定を整理する", 1],
          ["新技術スキャン", "調べた内容を短くまとめる", 3]
        ]
      },
      spy: {
        name: "スパイ",
        title: "情報局のエージェント",
        templates: [
          ["ターゲット分析", "次の一手を決めるために情報を読む", 3],
          ["痕跡整理", "不要なファイルやタブを閉じる", 1],
          ["暗号解読", "難しい問題を分解してメモする", 5]
        ]
      },
      life: {
        name: "日常整備",
        title: "日常整備士",
        templates: [
          ["机上リセット", "作業場所を5分だけ整える", 1],
          ["体力メンテ", "水分補給や軽いストレッチをする", 1],
          ["未来の自分へ補給", "明日の準備を一つ終わらせる", 3]
        ]
      }
    };

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `quest-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function cloneData(data) {
      if (typeof structuredClone === "function") {
        return structuredClone(data);
      }
      return JSON.parse(JSON.stringify(data));
    }

    const rewards = [
      { id: "coffee", name: "好きな飲み物", cost: 120 },
      { id: "break", name: "20分の自由時間", cost: 220 },
      { id: "game", name: "ゲーム・動画タイム", cost: 360 },
      { id: "special", name: "ちょっと良いごほうび", cost: 520 }
    ];

    const defaultState = {
      profile: {
        name: "冒険者",
        level: 1,
        exp: 0,
        hp: 100,
        mp: 80,
        gold: 0,
        title: "はじまりのクエスト管理者"
      },
      world: "fantasy",
      goal: "今日のメイン目標を書く",
      restMode: false,
      filter: "active",
      tasks: [
        {
          id: createId(),
          title: "今日のメインクエストを一つ決める",
          meaning: "最初の一歩を小さくすると、冒険が始めやすい。",
          difficulty: 1,
          goldReward: 18,
          fatigue: 6,
          status: "active",
          createdAt: new Date().toISOString()
        }
      ],
      logs: []
    };

    let state = loadState();

    const elements = {
      playerName: document.getElementById("playerName"),
      playerTitle: document.getElementById("playerTitle"),
      expText: document.getElementById("expText"),
      hpText: document.getElementById("hpText"),
      mpText: document.getElementById("mpText"),
      levelText: document.getElementById("levelText"),
      goldText: document.getElementById("goldText"),
      expBar: document.getElementById("expBar"),
      hpBar: document.getElementById("hpBar"),
      mpBar: document.getElementById("mpBar"),
      goalInput: document.getElementById("goalInput"),
      worldSelect: document.getElementById("worldSelect"),
      taskForm: document.getElementById("taskForm"),
      taskTitle: document.getElementById("taskTitle"),
      taskMeaning: document.getElementById("taskMeaning"),
      difficultySelect: document.getElementById("difficultySelect"),
      goldInput: document.getElementById("goldInput"),
      fatigueInput: document.getElementById("fatigueInput"),
      taskList: document.getElementById("taskList"),
      templateList: document.getElementById("templateList"),
      shopList: document.getElementById("shopList"),
      logList: document.getElementById("logList"),
      restButton: document.getElementById("restButton"),
      restModeButton: document.getElementById("restModeButton"),
      exportButton: document.getElementById("exportButton"),
      resetButton: document.getElementById("resetButton"),
      toast: document.getElementById("toast")
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return cloneData(defaultState);
        return { ...cloneData(defaultState), ...JSON.parse(saved) };
      } catch {
        return cloneData(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        elements.toast.classList.remove("show");
      }, 1900);
    }

    function addLog(message) {
      const time = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      state.logs.unshift(`[${time}] ${message}`);
      state.logs = state.logs.slice(0, 30);
    }

    function getDifficultyLabel(difficulty) {
      if (difficulty >= 5) return "Hard";
      if (difficulty >= 3) return "Normal";
      return "Easy";
    }

    function getDifficultyClass(difficulty) {
      if (difficulty >= 5) return "hard";
      if (difficulty >= 3) return "normal";
      return "easy";
    }

    function getDefaultGold(difficulty) {
      return difficulty * 18;
    }

    function getDefaultFatigue(difficulty) {
      return difficulty * 6;
    }

    function getTaskReward(task) {
      const difficulty = Number(task.difficulty) || 1;
      return {
        exp: difficulty * 20,
        gold: Number.isFinite(Number(task.goldReward)) ? Number(task.goldReward) : getDefaultGold(difficulty),
        fatigue: Number.isFinite(Number(task.fatigue)) ? Number(task.fatigue) : getDefaultFatigue(difficulty),
        mp: difficulty * 2
      };
    }

    function clampNumber(value, fallback, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, Math.round(number)));
    }

    function addTask(title, meaning, difficulty, goldReward, fatigue) {
      const safeDifficulty = clampNumber(difficulty, 3, 1, 5);
      state.tasks.unshift({
        id: createId(),
        title: title.trim(),
        meaning: meaning.trim() || "この一歩が、あとで効いてくる。",
        difficulty: safeDifficulty,
        goldReward: clampNumber(goldReward, getDefaultGold(safeDifficulty), 0, 9999),
        fatigue: clampNumber(fatigue, getDefaultFatigue(safeDifficulty), 0, 999),
        status: "active",
        createdAt: new Date().toISOString()
      });
      addLog(`「${title.trim()}」を受注しました。`);
      saveState();
      render();
    }

    function completeTask(id) {
      const task = state.tasks.find((item) => item.id === id);
      if (!task) return;

      const reward = getTaskReward(task);
      task.status = "completed";
      task.completedAt = new Date().toISOString();
      state.profile.exp += reward.exp;
      state.profile.gold += reward.gold;
      state.profile.mp = Math.min(100, state.profile.mp + reward.mp);

      while (state.profile.exp >= 100) {
        state.profile.exp -= 100;
        state.profile.level += 1;
        state.profile.hp = 100;
        state.profile.mp = 100;
        addLog(`LEVEL UP。Lv.${state.profile.level}になりました。`);
      }

      state.profile.hp -= reward.fatigue;

      addLog(`「${task.title}」達成。${reward.exp}EXP / ${reward.gold}Gを獲得、疲労でHP-${reward.fatigue}。`);
      if (state.profile.hp < 0) {
        addLog("HPがマイナスです。危険状態に入りました。");
      }
      showToast("クエスト達成");
      saveState();
      render();
    }

    function failTask(id) {
      const task = state.tasks.find((item) => item.id === id);
      if (!task) return;

      task.status = "failed";
      task.failedAt = new Date().toISOString();
      if (state.restMode) {
        addLog(`休憩モード中のため「${task.title}」はHP消費なしで記録しました。`);
      } else {
        state.profile.hp -= 10;
        state.profile.exp = Math.min(99, state.profile.exp + 5);
        addLog(`「${task.title}」を撤退ログに保存。学びとして5EXPを獲得。`);
        if (state.profile.hp < 0) {
          addLog("HPがマイナスです。危険状態に入りました。");
        }
      }

      showToast("ログに記録しました");
      saveState();
      render();
    }

    function restoreTask(id) {
      const task = state.tasks.find((item) => item.id === id);
      if (!task) return;
      task.status = "active";
      delete task.completedAt;
      delete task.failedAt;
      addLog(`「${task.title}」を再受注しました。`);
      saveState();
      render();
    }

    function removeTask(id) {
      const task = state.tasks.find((item) => item.id === id);
      state.tasks = state.tasks.filter((item) => item.id !== id);
      if (task) addLog(`「${task.title}」をアーカイブから削除しました。`);
      saveState();
      render();
    }

    function buyReward(reward) {
      if (state.profile.gold < reward.cost) {
        showToast("ゴールドが足りません");
        return;
      }
      state.profile.gold -= reward.cost;
      state.profile.hp = Math.min(100, state.profile.hp + 8);
      addLog(`報酬「${reward.name}」と交換しました。`);
      showToast("報酬を交換しました");
      saveState();
      render();
    }

    function recover() {
      state.profile.hp = Math.min(100, state.profile.hp + 24);
      state.profile.mp = Math.min(100, state.profile.mp + 32);
      addLog("休憩してHPとMPを回復しました。");
      showToast("回復しました");
      saveState();
      render();
    }

    function toggleRestMode() {
      state.restMode = !state.restMode;
      addLog(state.restMode ? "休憩モードをONにしました。" : "休憩モードをOFFにしました。");
      saveState();
      render();
    }

    function exportData() {
      const data = JSON.stringify(state, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "adventure-todo-quest.json";
      anchor.click();
      URL.revokeObjectURL(url);
      showToast("JSONを書き出しました");
    }

    function resetData() {
      const ok = window.confirm("保存データを初期化しますか？");
      if (!ok) return;
      state = cloneData(defaultState);
      addLog("新しい冒険を開始しました。");
      saveState();
      render();
    }

    function setFilter(filter) {
      state.filter = filter;
      saveState();
      renderTasks();
      renderTabs();
    }

    function renderProfile() {
      const profile = state.profile;
      profile.title = "はじまりのクエスト管理者";
      const hpPercent = Math.min(100, Math.max(0, profile.hp));

      elements.playerName.textContent = profile.name;
      elements.playerTitle.textContent = profile.title;
      elements.expText.textContent = `${profile.exp}/100`;
      elements.hpText.textContent = `${profile.hp}/100`;
      elements.mpText.textContent = `${profile.mp}/100`;
      elements.levelText.textContent = profile.level;
      elements.goldText.textContent = profile.gold;
      elements.expBar.style.width = `${profile.exp}%`;
      elements.hpBar.style.width = `${hpPercent}%`;
      elements.mpBar.style.width = `${profile.mp}%`;
      elements.restModeButton.textContent = state.restMode ? "休憩モード ON" : "休憩モード OFF";
      elements.restModeButton.className = state.restMode ? "btn good" : "btn ghost";
      document.body.classList.toggle("danger-state", profile.hp < 0);
    }

    function renderGoal() {
      elements.worldSelect.value = state.world;
      elements.goalInput.value = state.goal || "";
    }

    function renderTemplates() {
      const pack = worldPacks[state.world];
      elements.templateList.replaceChildren();
      pack.templates.forEach(([title, meaning, difficulty]) => {
        const button = document.createElement("button");
        button.className = "btn ghost";
        button.type = "button";
        button.textContent = title;
        button.title = meaning;
        button.addEventListener("click", () => addTask(title, meaning, difficulty));
        elements.templateList.append(button);
      });
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.filter === state.filter);
      });
    }

    function renderTasks() {
      renderTabs();
      elements.taskList.replaceChildren();

      const tasks = state.tasks.filter((task) => task.status === state.filter);
      if (tasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = state.filter === "active"
          ? "進行中のクエストはありません。テンプレートか入力欄から追加できます。"
          : "ここにはまだ記録がありません。";
        elements.taskList.append(empty);
        return;
      }

      tasks.forEach((task) => {
        const reward = getTaskReward(task);
        const card = document.createElement("article");
        card.className = `task-card ${getDifficultyClass(task.difficulty)}`;

        const body = document.createElement("div");
        const label = document.createElement("span");
        label.className = "pill";
        label.textContent = getDifficultyLabel(task.difficulty);

        const title = document.createElement("h3");
        title.textContent = task.title;

        const meaning = document.createElement("p");
        meaning.textContent = task.meaning;

        const meta = document.createElement("div");
        meta.className = "task-meta";
        [`${reward.exp}EXP`, `${reward.gold}G`, `疲労 ${reward.fatigue}`, new Date(task.createdAt).toLocaleDateString("ja-JP")].forEach((text) => {
          const item = document.createElement("span");
          item.className = "pill";
          item.textContent = text;
          meta.append(item);
        });

        body.append(label, title, meaning, meta);

        const actions = document.createElement("div");
        actions.className = "task-actions";
        if (task.status === "active") {
          actions.append(
            actionButton("完了", "btn good", () => completeTask(task.id)),
            actionButton("撤退", "btn danger", () => failTask(task.id))
          );
        } else {
          actions.append(
            actionButton("再開", "btn ghost", () => restoreTask(task.id)),
            actionButton("削除", "btn danger", () => removeTask(task.id))
          );
        }

        card.append(body, actions);
        elements.taskList.append(card);
      });
    }

    function actionButton(text, className, handler) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = text;
      button.addEventListener("click", handler);
      return button;
    }

    function renderShop() {
      elements.shopList.replaceChildren();
      rewards.forEach((reward) => {
        const item = document.createElement("div");
        item.className = "reward";

        const body = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = reward.name;
        const cost = document.createElement("span");
        cost.textContent = `${reward.cost} Gold`;
        body.append(name, cost);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn primary";
        button.textContent = "交換";
        button.disabled = state.profile.gold < reward.cost;
        button.addEventListener("click", () => buyReward(reward));

        item.append(body, button);
        elements.shopList.append(item);
      });
    }

    function renderLogs() {
      elements.logList.replaceChildren();
      const logs = state.logs.length ? state.logs : ["冒険ログはここに記録されます。"];
      logs.forEach((log) => {
        const item = document.createElement("div");
        item.className = "log-item";
        item.textContent = log;
        elements.logList.append(item);
      });
    }

    function render() {
      renderProfile();
      renderGoal();
      renderTemplates();
      renderTasks();
      renderShop();
      renderLogs();
    }

    function syncQuestDefaults() {
      const difficulty = clampNumber(elements.difficultySelect.value, 3, 1, 5);
      elements.goldInput.value = getDefaultGold(difficulty);
      elements.fatigueInput.value = getDefaultFatigue(difficulty);
    }

    function saveGoalSoon() {
      state.goal = elements.goalInput.value;
      window.clearTimeout(saveGoalSoon.timer);
      saveGoalSoon.timer = window.setTimeout(saveState, 250);
    }

    elements.taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      addTask(
        elements.taskTitle.value,
        elements.taskMeaning.value,
        Number(elements.difficultySelect.value),
        elements.goldInput.value,
        elements.fatigueInput.value
      );
      elements.taskForm.reset();
      elements.difficultySelect.value = "3";
      syncQuestDefaults();
      elements.taskTitle.focus();
    });

    elements.difficultySelect.addEventListener("change", syncQuestDefaults);
    elements.goalInput.addEventListener("input", saveGoalSoon);
    elements.goalInput.addEventListener("blur", () => {
      state.goal = elements.goalInput.value;
      saveState();
    });

    elements.worldSelect.addEventListener("change", () => {
      state.world = elements.worldSelect.value;
      addLog(`テンプレ世界観を「${worldPacks[state.world].name}」に変更しました。`);
      saveState();
      render();
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => setFilter(tab.dataset.filter));
    });

    elements.restButton.addEventListener("click", recover);
    elements.restModeButton.addEventListener("click", toggleRestMode);
    elements.exportButton.addEventListener("click", exportData);
    elements.resetButton.addEventListener("click", resetData);

    if (state.logs.length === 0) {
      addLog("冒険を開始しました。");
      saveState();
    }
    render();
  </script>
</body>
</html>
