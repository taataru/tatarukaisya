<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>たるこ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <button
        class="sidebar-toggle"
        id="sidebarToggle"
        type="button"
        aria-label="会話ログを閉じる"
        aria-expanded="true"
        title="会話ログを閉じる"
      >
        <i data-lucide="panel-left-close"></i>
      </button>

      <aside class="sidebar" aria-label="会話リスト">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="assets/ai-avatar.png" alt="" />
          </div>
          <div>
            <p class="brand-kicker">AIチャット</p>
            <h1>たるこ</h1>
          </div>
        </div>

        <button class="new-chat button-primary" type="button">
          <i data-lucide="plus"></i>
          <span>新しい会話</span>
        </button>

        <nav class="chat-list" aria-label="最近の会話"></nav>

        <div class="storage-meter daily-quota" id="dailyQuota" aria-label="会話ノルマ">
          <div class="meter-label">
            <span>会話ノルマ</span>
            <strong id="quotaCount">0/20</strong>
          </div>
          <div class="quota-row">
            <span class="quota-state" id="quotaState">あと20回</span>
            <button class="quota-close" id="quotaClose" type="button" aria-label="会話ノルマを閉じる" title="閉じる">
              <i data-lucide="x"></i>
            </button>
          </div>
          <div class="meter-track">
            <span id="quotaProgress"></span>
          </div>
        </div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div class="model-card">
            <div>
              <p>たるこ</p>
              <span><b id="connectionDot"></b><span id="connectionLabel">未接続</span></span>
            </div>
          </div>

          <div class="topbar-actions" aria-label="会話操作">
            <button class="icon-button" type="button" aria-label="検索" title="検索">
              <i data-lucide="search"></i>
            </button>
          </div>
        </header>

        <section class="connection-strip" aria-label="接続設定">
          <label class="endpoint-field">
            <span>trycloudflare URL</span>
            <input
              id="endpointInput"
              type="url"
              placeholder="https://example.trycloudflare.com"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <label class="model-field">
            <span>モデル</span>
            <input id="modelInput" type="text" value="gemma4:e2b" autocomplete="off" spellcheck="false" />
          </label>
          <button class="icon-button" id="testConnection" type="button" aria-label="接続テスト" title="接続テスト">
            <i data-lucide="plug-zap"></i>
          </button>
          <span class="status-pill" id="connectionStatus">未設定</span>
        </section>

        <section class="messages" id="messages" aria-label="会話"></section>

        <section class="composer-wrap" aria-label="入力欄">
          <div class="prompt-chips" aria-label="候補">
            <button type="button">接続テストをして</button>
            <button type="button">この画像を見て</button>
            <button type="button">この文章を短くして</button>
            <button type="button">コードのエラーを見て</button>
          </div>

          <div class="attachment-preview" id="attachmentPreview" aria-live="polite"></div>

          <form class="composer" id="composer">
            <button class="icon-button" id="attachImageButton" type="button" aria-label="画像を添付" title="画像を添付">
              <i data-lucide="paperclip"></i>
            </button>
            <input
              class="file-input"
              id="imageInput"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              multiple
            />
            <textarea
              id="messageInput"
              name="message"
              rows="1"
              placeholder="たるこにメッセージを送る"
              autocomplete="off"
            ></textarea>
            <button class="send-button" type="submit" aria-label="送信" title="送信">
              <i data-lucide="send"></i>
            </button>
          </form>
        </section>
      </main>
    </div>

    <div class="persona-modal" id="personaModal" aria-hidden="true">
      <form class="persona-dialog" id="personaForm" role="dialog" aria-modal="true" aria-labelledby="personaTitle">
        <div class="persona-head">
          <h2 id="personaTitle">AI設定</h2>
          <button class="icon-button" id="closePersona" type="button" aria-label="閉じる" title="閉じる">
            <i data-lucide="x"></i>
          </button>
        </div>

        <fieldset class="persona-group persona-group-two">
          <legend>性別</legend>
          <label><input type="radio" name="gender" value="女性" checked /><span>女性</span></label>
          <label><input type="radio" name="gender" value="男性" /><span>男性</span></label>
        </fieldset>

        <fieldset class="persona-group">
          <legend>関係</legend>
          <label><input type="radio" name="relationship" value="友達" checked /><span>友達</span></label>
          <label><input type="radio" name="relationship" value="恋人" /><span>恋人</span></label>
          <label><input type="radio" name="relationship" value="相棒" /><span>相棒</span></label>
          <label><input type="radio" name="relationship" value="先生" /><span>先生</span></label>
        </fieldset>

        <fieldset class="persona-group">
          <legend>性格</legend>
          <label><input type="radio" name="personality" value="やさしい" checked /><span>やさしい</span></label>
          <label><input type="radio" name="personality" value="ツンデレ" /><span>ツンデレ</span></label>
          <label><input type="radio" name="personality" value="クール" /><span>クール</span></label>
          <label><input type="radio" name="personality" value="元気" /><span>元気</span></label>
        </fieldset>

        <fieldset class="persona-group">
          <legend>種族</legend>
          <label><input type="radio" name="species" value="人" checked /><span>人</span></label>
          <label><input type="radio" name="species" value="犬" /><span>犬</span></label>
          <label><input type="radio" name="species" value="猫" /><span>猫</span></label>
          <label><input type="radio" name="species" value="ロボット" /><span>ロボット</span></label>
        </fieldset>

        <label class="persona-other">
          <span>その他</span>
          <textarea id="personaOther" name="other" rows="3" maxlength="120" placeholder="呼び方、口調、守ってほしい設定など"></textarea>
        </label>

        <div class="persona-actions">
          <button class="ghost-button" id="cancelPersona" type="button">キャンセル</button>
          <button class="button-primary persona-start" type="submit">
            <i data-lucide="sparkles"></i>
            <span>開始</span>
          </button>
        </div>
      </form>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
