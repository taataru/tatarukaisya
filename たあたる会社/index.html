<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たあたる会社</title>
    <style>
        :root {
            --bg-color: #030812;
            --text-main: #d4e8ff;
            --text-sub: #7a9ac2;
            --accent-glow: #00f0ff;
            --accent-secondary: #ff0055;
            --card-bg: rgba(7, 18, 40, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Roboto', 'Verdana', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(3, 8, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
            z-index: 1000;
            padding: 20px 0;
            text-align: center;
        }
        
        header h1 {
            color: var(--text-main);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        main {
            padding-top: 100px;
        }

        section {
            min-height: 80vh;
            padding: 40px 20px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 15px var(--accent-glow);
            border-bottom: 2px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 10px;
            display: inline-block;
            width: 100%;
        }

        p {
            font-size: 1.15rem;
            margin-bottom: 1.5rem;
        }

        .highlight-blue {
            color: var(--accent-glow);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .member-box {
            background: rgba(3, 8, 18, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .member-box:hover {
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transform: translateY(-5px);
        }

        .role-tag {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 240, 255, 0.2);
            color: var(--accent-glow);
            padding: 3px 15px;
            font-size: 0.8rem;
            font-weight: bold;
            border-bottom-right-radius: 8px;
            border-right: 1px solid var(--accent-glow);
            border-bottom: 1px solid var(--accent-glow);
        }

        .member-name {
            font-size: 1.6rem;
            color: #fff;
            margin: 15px 0;
            font-weight: 800;
        }

        .member-desc {
            font-size: 1.05rem;
            color: var(--text-sub);
        }

        .notice-banner {
            background: linear-gradient(90deg, transparent, rgba(255, 0, 85, 0.15), transparent);
            border-top: 2px solid var(--accent-secondary);
            border-bottom: 2px solid var(--accent-secondary);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 40px 0;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-secondary);
        }

        @media (max-width: 860px) {
            h2 {
                font-size: 2rem;
            }
            section {
                padding: 40px 20px 60px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <header>
        <h1>たあたる会社</h1>
    </header>
    <main>
        <section>
            <div class="container">
                <h2>活動内容</h2>
                <div style="text-align:center; max-width:800px; margin: 0 auto;">
                    <p>たあたる会社は<span class="highlight-blue">ブレンダーとユニティを使って東亜学園周辺を舞台にしたゲーム</span>を作っています。</p>
                    <p>また、<span class="highlight-blue">ローカルAIとゲームの融合</span>についての研究も行っています。</p>
                </div>

                <div class="notice-banner">
                    ※ たあたる会社は９月の文化祭終わりに閉業します。
                </div>

                <h2 style="margin-top: 40px;">社員一覧</h2>
                <div class="grid-container">
                    <div class="member-box">
                        <div class="role-tag">部長</div>
                        <div class="member-name">大島</div>
                        <div class="member-desc">
                            <span class="highlight-blue">レンガテクスチャ</span>
                        </div>
                    </div>

                    <div class="member-box">
                        <div class="role-tag">社員</div>
                        <div class="member-name">いもん</div>
                        <div class="member-desc">
                            <span class="highlight-blue">こだわり</span>
                        </div>
                    </div>

                    <div class="member-box">
                        <div class="role-tag">社員</div>
                        <div class="member-name">首藤</div>
                        <div class="member-desc">
                            <span class="highlight-blue">ブーリアンが強い</span>
                        </div>
                    </div>

                    <div class="member-box" style="border-style: dashed;">
                        <div class="role-tag">研修中</div>
                        <div class="member-name">山口</div>
                        <div class="member-desc">
                            <span class="highlight-blue">ローカルAIについて研究中</span><br>
                            研修期間
                        </div>
                    </div>

                    <div class="member-box" style="border-color: rgba(122, 154, 194, 0.3); background: rgba(3, 8, 18, 0.4);">
                        <div class="role-tag" style="background: rgba(122, 154, 194, 0.1); color: var(--text-sub); border-color: rgba(122, 154, 194, 0.3);">休職中</div>
                        <div class="member-name" style="color: var(--text-sub);">吉田</div>
                        <div class="member-desc">
                            休んでる
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
